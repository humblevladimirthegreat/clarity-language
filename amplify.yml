version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify ignores .nvmrc / engines; install and select the pinned Node
        - nvm install
        - nvm use
        - node --version
        - npm ci
    build:
      commands:
        - npm run docs:publish
  artifacts:
    # VitePress writes to dist/grammar/ (base /grammar/); publish repo dist/
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - docs/grammar/public/tts/**/*
