version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run lint:md
    build:
      commands:
        - npm run docs:build
  artifacts:
    # VitePress writes to dist/grammar/ (base /grammar/); publish repo dist/
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
