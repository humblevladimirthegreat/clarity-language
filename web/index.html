<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clarity Lexicon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f0;
      --bg-accent: #ebe6dc;
      --ink: #1a1a18;
      --muted: #5c5a54;
      --line: #d4cfc4;
      --row-hover: #e8e2d6;
      --focus: #2a6f6a;
      --review: #8a6a2a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #e4efe8 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #efe8dc 0%, transparent 50%),
        var(--bg);
    }

    main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    header {
      margin-bottom: 1.75rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    input[type="search"] {
      flex: 1 1 14rem;
      min-width: 0;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
    }

    input[type="search"]:focus {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
      border-color: var(--focus);
    }

    .count {
      color: var(--muted);
      font-size: 0.875rem;
      white-space: nowrap;
    }

    .status {
      padding: 1.5rem;
      color: var(--muted);
      text-align: center;
    }

    .status.error {
      color: #8b2e2e;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 0 rgba(26, 26, 24, 0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    thead {
      position: sticky;
      top: 0;
      background: var(--bg-accent);
      z-index: 1;
    }

    th {
      text-align: left;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 0.55rem 1rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    .emoji {
      font-size: 1.45rem;
      line-height: 1;
      width: 3.5rem;
    }

    .literal {
      color: var(--ink);
    }

    .clarity {
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .empty {
      color: var(--muted);
    }

    .review {
      color: var(--review);
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .match-fields {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.78rem;
    }

    @media (max-width: 720px) {
      th, td {
        padding: 0.5rem 0.65rem;
      }

      .emoji {
        width: 2.75rem;
      }

      .match-fields {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Clarity Lexicon</h1>
      <p class="subtitle">Published emoji roots — literal, metaphorical, and Clarity word</p>
    </header>

    <div class="toolbar">
      <label for="filter">Search</label>
      <input id="filter" type="search" placeholder="Search literal, metaphor, clarity, mnemonic…" autocomplete="off" />
      <span class="count" id="count" hidden></span>
    </div>

    <div id="status" class="status">Loading…</div>
    <div class="table-wrap" id="table-wrap" hidden>
      <table>
        <thead>
          <tr>
            <th scope="col">Emoji</th>
            <th scope="col">Literal</th>
            <th scope="col">Clarity</th>
            <th scope="col">Metaphorical</th>
            <th scope="col">Overlays</th>
            <th scope="col">Mnemonic</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import {
      createLexiconIndex,
      createOverlayIndex,
      parseOverlayCsv,
      parsePublishedCsv,
      searchLexicon,
    } from "./lib/lexicon-search.js";

    const CSV_URL = "../data/lexicon-published.csv";
    const OVERLAY_URL = "../data/lexicon-overlays.csv";
    const DEBOUNCE_MS = 100;

    /** @type {import("../src/lexicon-search.js").PublishedRow[]} */
    let rows = [];
    /** @type {import("../src/lexicon-search.js").OverlayRow[]} */
    let overlays = [];
    /** @type {import("minisearch").default | null} */
    let index = null;
    /** @type {import("minisearch").default | null} */
    let overlayIndex = null;
    let debounceTimer = 0;

    /** @param {string} s */
    function escapeHtml(s) {
      return s
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

  /** @param {string} value */
    function formatMetaphorical(value) {
      if (!value) return '<span class="empty">—</span>';
      return escapeHtml(value);
    }

    /** @param {string} value */
    function formatMnemonic(value) {
      if (!value) return '<span class="empty">—</span>';
      if (value === "REVIEW") return '<span class="review">REVIEW</span>';
      return escapeHtml(value);
    }

    /** @param {import("../src/lexicon-search.js").LexiconSearchResult} row */
    function formatOverlays(row) {
      if (!row.overlays || row.overlays.length === 0) {
        return '<span class="empty">—</span>';
      }
      const text = row.overlays
        .map((o) => `${o.senseForm}+${o.pos}: ${o.definition}`)
        .join("; ");
      return escapeHtml(text);
    }

    /** @param {import("../src/lexicon-search.js").LexiconSearchResult} row */
    function renderRow(row) {
      const matchLabel =
        row.matchFields.length > 0
          ? `<span class="match-fields">matched: ${escapeHtml(row.matchFields.join(", "))}</span>`
          : "";
      const literalLabel = row.literal || (row.overlayOnly ? row.overlays[0]?.definition || "(overlay)" : "—");

      return `
        <td class="emoji">${row.emoji || "—"}</td>
        <td class="literal">${escapeHtml(literalLabel)}${matchLabel}</td>
        <td class="clarity">${escapeHtml(row.clarity)}</td>
        <td>${formatMetaphorical(row.metaphorical)}</td>
        <td>${formatOverlays(row)}</td>
        <td>${formatMnemonic(row.mnemonic)}</td>
      `;
    }

    /** @param {string} query */
    function render(query = "") {
      const results = searchLexicon(index, rows, query, { overlays, overlayIndex });
      const tbody = document.getElementById("tbody");
      tbody.replaceChildren(
        ...results.map((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = renderRow(row);
          return tr;
        }),
      );

      const count = document.getElementById("count");
      count.hidden = false;
      const trimmed = query.trim();
      count.textContent = !trimmed
        ? `${rows.length} rows`
        : `${results.length} of ${rows.length}`;
    }

    async function main() {
      const status = document.getElementById("status");
      const wrap = document.getElementById("table-wrap");
      try {
        const [publishedRes, overlayRes] = await Promise.all([
          fetch(CSV_URL),
          fetch(OVERLAY_URL),
        ]);
        if (!publishedRes.ok) throw new Error(`HTTP ${publishedRes.status} for published CSV`);
        if (!overlayRes.ok) throw new Error(`HTTP ${overlayRes.status} for overlay CSV`);
        rows = parsePublishedCsv(await publishedRes.text());
        overlays = parseOverlayCsv(await overlayRes.text());
        index = createLexiconIndex(rows);
        overlayIndex = createOverlayIndex(overlays);
        status.hidden = true;
        wrap.hidden = false;
        render();
      } catch (err) {
        status.classList.add("error");
        status.textContent =
          `Could not load ${CSV_URL}. Serve the repo root (e.g. npm run web) so the CSV is reachable.`;
        console.error(err);
      }
    }

    document.getElementById("filter").addEventListener("input", (e) => {
      const value = /** @type {HTMLInputElement} */ (e.target).value;
      window.clearTimeout(debounceTimer);
      debounceTimer = window.setTimeout(() => render(value), DEBOUNCE_MS);
    });

    main();
  </script>
</body>
</html>
